version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quickdatings
      POSTGRES_USER: quickuser
      POSTGRES_PASSWORD: quickpassword
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: quickdatings
      POSTGRES_USER: quickuser
      POSTGRES_PASSWORD: quickpassword
    depends_on:
      - db
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    environment:
      - VITE_API_BASE_URL=http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  db_data: {}

